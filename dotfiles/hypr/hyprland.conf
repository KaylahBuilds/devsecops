# ── Hyprland ──────────────────────────────────────────────────────────────────
# Rounded, blurred, transparent look from the screenshot.

monitor = , preferred, auto, 1

exec-once = waybar
exec-once = swww-daemon && swww img ~/.config/hypr/wallpaper.jpg --transition-type grow
exec-once = dunst
exec-once = wl-paste --watch cliphist store

env = XCURSOR_SIZE,24
env = GDK_SCALE,1

$terminal = kitty
$menu     = rofi -show drun
$mod      = SUPER

input {
    kb_layout = us
    follow_mouse = 1
    touchpad { natural_scroll = true }
}

general {
    gaps_in = 6
    gaps_out = 14
    border_size = 2
    col.active_border   = rgba(ff79c6ee) rgba(8be9fdee) 45deg
    col.inactive_border = rgba(44475aaa)
    layout = dwindle
}

decoration {
    rounding = 14
    active_opacity   = 1.0
    inactive_opacity = 0.95

    blur {
        enabled = true
        size = 8
        passes = 3
        new_optimizations = true
        ignore_opacity = true
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(00000066)
    }
}

animations {
    enabled = true
    bezier = ease, 0.05, 0.9, 0.1, 1.0
    animation = windows,     1, 5, ease, slide
    animation = windowsOut,  1, 5, ease, slide
    animation = fade,        1, 6, default
    animation = workspaces,  1, 5, ease, slidefade
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

# Make the terminal translucent so the wallpaper shows through (kitty also sets opacity).
windowrulev2 = opacity 0.90 0.85, class:^(kitty)$
layerrule    = blur, waybar
layerrule    = ignorezero, waybar

# ── Keybinds ──────────────────────────────────────────────────────────────────
bind = $mod, Return, exec, $terminal
bind = $mod, D,      exec, $menu
bind = $mod, Q,      killactive
bind = $mod, F,      fullscreen
bind = $mod, V,      togglefloating
bind = $mod SHIFT, E, exit

bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
