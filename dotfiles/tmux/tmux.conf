# ── tmux ──────────────────────────────────────────────────────────────────────
# Status bar on TOP: green session pill | numbered window tabs | weather on the right.

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB,xterm-kitty:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g escape-time 0
set -g history-limit 50000
set -g focus-events on
setw -g mode-keys vi

# Prefix: C-a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Splits / navigation
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind r source-file ~/.config/tmux/tmux.conf \; display "reloaded"
bind , command-prompt -p "rename window:" "rename-window '%%'"

# ── Look ──────────────────────────────────────────────────────────────────────
set -g status on
set -g status-position top
set -g status-interval 300
set -g status-justify left
set -g status-style "bg=default,fg=#c0caf5"
set -g status-left-length 40
set -g status-right-length 80

# Session name in a green pill
set -g status-left "#[fg=#0d0f12,bg=#5eff6c,bold] #S #[default] "

# Windows: "1 Editor"  — active one gets a lavender pill with a *
setw -g window-status-separator ""
setw -g window-status-format         "#[fg=#c0caf5] #I #W#{?window_flags,#{s/\\*//:window_flags},} "
setw -g window-status-current-format "#[fg=#0d0f12,bg=#bd93f9,bold] #I #W* #[default]"
setw -g window-status-activity-style "fg=#ffb86c"

# Weather pill on the right (orange)
set -g status-right "#[fg=#0d0f12,bg=#ffb86c,bold] #(~/.config/tmux/scripts/weather.sh) #[default]"

set -g pane-border-style        "fg=#3c4048"
set -g pane-active-border-style "fg=#bd93f9"
set -g message-style            "bg=#bd93f9,fg=#0d0f12"
set -g mode-style               "bg=#5ef1ff,fg=#0d0f12"

# ── Dev layout: window 1 nvim, window 2 shell, window 3 project + lazygit ─────
# prefix + P builds the layout for the current directory.
bind P source-file ~/.config/tmux/scripts/dev-layout.tmux
