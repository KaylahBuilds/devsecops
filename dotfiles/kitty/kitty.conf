# ── kitty ─────────────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        12.0

background_opacity        0.85
dynamic_background_opacity yes
window_padding_width      6
confirm_os_window_close   0
enable_audio_bell         no
cursor_shape              beam
scrollback_lines          10000

# Dark neon palette (matches the Neovim cyberdream theme)
foreground #ffffff
background #0d0f12
selection_foreground #0d0f12
selection_background #5ef1ff
cursor #5ef1ff

color0  #16181a
color8  #3c4048
color1  #ff6e5e
color9  #ff6e5e
color2  #5eff6c
color10 #5eff6c
color3  #f1ff5e
color11 #f1ff5e
color4  #5ea1ff
color12 #5ea1ff
color5  #ff5ef1
color13 #ff5ef1
color6  #5ef1ff
color14 #5ef1ff
color7  #ffffff
color15 #ffffff

# Start straight into tmux
shell tmux new-session -A -s main
